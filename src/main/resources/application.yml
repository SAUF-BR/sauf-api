spring:
  application:
    name: sauf-api
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: ${SAUF_DB_URL}
    username: ${SAUF_DB_USER}
    password: ${SAUF_DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_batch_fetch_size: 50
  data:
    web:
      pageable:
        max-page-size: 50
  flyway:
    enabled: true

sauf:
  cors:
    origens-permitidas: ${SAUF_CORS_ORIGENS:http://localhost:5173}
  ingestao:
    api-key: ${SAUF_API_KEY:}

springdoc:
  api-docs:
    path: /api/v1/docs
  swagger-ui:
    path: /api/v1/swagger
